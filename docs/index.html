<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Zone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <header id="app-header">
    <div class="header-inner">
      <div class="logo" id="logo">✏️ Study Zone</div>
      <div class="header-right"><span id="sync-slot"></span></div>
    </div>
  </header>

  <main class="view">
    <div class="home-floats" aria-hidden="true">
      <span class="hf hf1">🔬</span><span class="hf hf2">📐</span><span class="hf hf3">🌍</span><span class="hf hf4">📚</span>
      <span class="hf hf5">💻</span><span class="hf hf6">🧬</span><span class="hf hf7">🌟</span><span class="hf hf8">⚗️</span>
    </div>

    <div class="home-hero">
      <h1 id="home-greeting">Welcome back! 👋</h1>
      <p id="home-subtitle" class="home-subtitle"></p>
    </div>

    <div id="week-strip" class="week-strip"></div>

    <div id="subject-grid" class="subject-grid"></div>
  </main>

</div>

<script src="data/manifest.js"></script>
<script src="js/common.js"></script>
<script src="js/store.js"></script>
<script src="js/sync.js"></script>
<script src="js/sync-ui.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
